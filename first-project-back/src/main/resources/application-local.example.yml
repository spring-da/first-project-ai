# 复制为 application-local.yml，并在 IDEA 中启用 local Profile。
# 此文件包含占位符，application-local.yml 已加入 .gitignore。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/devnest?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: devnest
    password: 在这里填写你的MySQL密码

app:
  security:
    jwt-secret-base64: 在这里填写至少32字节随机密钥的Base64
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:8080
