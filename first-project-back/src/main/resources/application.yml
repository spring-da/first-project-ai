spring:
  application:
    name: devnest-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/postgresql
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # ZIP 导入允许 100 MB；图片接口仍在业务层严格限制单张 20 MiB。
      max-file-size: 100MB
      max-request-size: 105MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    security-token: ${OSS_SECURITY_TOKEN:}
    prefix: ${OSS_IMAGE_PREFIX:markdown/images}
    image-time-zone: ${OSS_IMAGE_TIME_ZONE:Asia/Shanghai}
    public-read: ${OSS_PUBLIC_READ:false}
  security:
    issuer: ${JWT_ISSUER:devnest-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT12H}
    # 仅供首次本地启动；部署前务必通过环境变量替换。
    jwt-secret-base64: ${JWT_SECRET_BASE64}
  account-security:
    invitation-token-ttl: ${INVITATION_TOKEN_TTL:PT48H}
    temporary-password-ttl: ${TEMPORARY_PASSWORD_TTL:PT30M}
    login-failure-threshold: ${LOGIN_FAILURE_THRESHOLD:5}
    login-lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
    login-rate-limit-attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:10}
    login-rate-limit-window: ${LOGIN_RATE_LIMIT_WINDOW:PT1M}
    save-rate-limit-attempts: ${SAVE_RATE_LIMIT_ATTEMPTS:12}
    save-rate-limit-window: ${SAVE_RATE_LIMIT_WINDOW:PT10S}
    bootstrap-admin-required: ${BOOTSTRAP_ADMIN_REQUIRED:false}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
