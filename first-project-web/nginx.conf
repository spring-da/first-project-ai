server {
    listen 8000;
    listen [::]:8000;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    charset utf-8;
    # ZIP batch import allows 100 MiB; the image endpoint still enforces 20 MiB per image.
    client_max_body_size 105m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 将浏览器的 /api 请求转发到 Spring Boot 容器
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        # Preserve the browser-facing host and non-default port (for example :8000).
        # Spring uses this information when determining whether an Origin is same-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    # Vite 带 hash 的静态资源可以长期缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 不长期缓存，避免部署后仍打开旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }
}
