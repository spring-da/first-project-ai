server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    # Drop requests addressed to the server IP or an unconfigured hostname.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;

    # Also reject a mismatched HTTP Host after a valid domain's TLS handshake.
    return 444;
}

server {
    listen 80;
    listen [::]:80;

    server_name springda.top;
    server_tokens off;

    return 308 https://springda.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name springda.top;

    # Read-only mount from first-project-back/certs; add both files before starting.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    charset utf-8;
    # ZIP batch import allows 100 MiB; the image endpoint still enforces 20 MiB per image.
    client_max_body_size 105m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # 将浏览器的 /api 请求转发到 Spring Boot 容器
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        # TLS terminates here; Spring must see the public HTTPS origin and port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    # 只有 Vite /assets 下带 hash 的构建产物可以长期缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 根目录中的 favicon 等文件名不带 hash，部署后必须允许浏览器重新验证。
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /theme-bootstrap.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # index.html 不长期缓存，避免部署后仍打开旧版本
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }
}
