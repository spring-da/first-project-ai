name: Verify DevNest
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: first-project-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: first-project-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ui:build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: first-project-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - run: mvn -B -ntp verify
