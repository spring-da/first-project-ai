services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devnest}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      APP_DB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgresql/10-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks:
      - devnest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devnest}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      JWT_ISSUER: devnest-api
      JWT_ACCESS_TOKEN_TTL: PT12H
      INVITATION_TOKEN_TTL: ${INVITATION_TOKEN_TTL:-PT48H}
      TEMPORARY_PASSWORD_TTL: ${TEMPORARY_PASSWORD_TTL:-PT30M}
      LOGIN_FAILURE_THRESHOLD: ${LOGIN_FAILURE_THRESHOLD:-5}
      LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-PT15M}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-PT1M}
      BOOTSTRAP_ADMIN_REQUIRED: ${BOOTSTRAP_ADMIN_REQUIRED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SERVER_PORT: 8080
      # Trust the forwarding headers overwritten by the Nginx container so Spring sees
      # the original public scheme, host, port and client address.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_POOL_MAX_SIZE: 10
      DB_POOL_MIN_IDLE: 2
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_SECURITY_TOKEN: ${OSS_SECURITY_TOKEN:-}
      OSS_IMAGE_PREFIX: ${OSS_IMAGE_PREFIX:-markdown/images}
      OSS_IMAGE_TIME_ZONE: ${OSS_IMAGE_TIME_ZONE:-Asia/Shanghai}
      OSS_PUBLIC_READ: ${OSS_PUBLIC_READ:-false}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - devnest-network
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: devnest-web:latest
    build:
      context: ../first-project-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - devnest-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  devnest-network:

volumes:
  postgres-data:
