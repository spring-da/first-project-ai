services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: devnest
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devnest-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/devnest?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      JWT_ISSUER: devnest-api
      JWT_ACCESS_TOKEN_TTL: PT12H
      INVITATION_TOKEN_TTL: ${INVITATION_TOKEN_TTL:-PT48H}
      TEMPORARY_PASSWORD_TTL: ${TEMPORARY_PASSWORD_TTL:-PT30M}
      LOGIN_FAILURE_THRESHOLD: ${LOGIN_FAILURE_THRESHOLD:-5}
      LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-PT15M}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-PT1M}
      BOOTSTRAP_ADMIN_REQUIRED: ${BOOTSTRAP_ADMIN_REQUIRED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SERVER_PORT: 8080
      # Trust the forwarding headers overwritten by the Nginx container so Spring sees
      # the original public scheme, host, port and client address.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_POOL_MAX_SIZE: 10
      DB_POOL_MIN_IDLE: 2
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_SECURITY_TOKEN: ${OSS_SECURITY_TOKEN:-}
      OSS_IMAGE_PREFIX: ${OSS_IMAGE_PREFIX:-markdown/images}
      OSS_IMAGE_TIME_ZONE: ${OSS_IMAGE_TIME_ZONE:-Asia/Shanghai}
      OSS_PUBLIC_READ: ${OSS_PUBLIC_READ:-false}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - devnest-network
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: devnest-web:latest
    build:
      context: ../first-project-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - devnest-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  devnest-network:

volumes:
  mysql-data:
